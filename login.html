<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Blockpit | Log In</title>
    <meta name="robots" content="noindex">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="Log in to your Blockpit account to manage your crypto taxes and optimize your portfolio." name="description">
    <meta content="Blockpit" property="og:site_name">
    <meta content="website" property="og:type">
    <meta content="Blockpit | Log In" property="og:title">
    <meta content="Log in to your Blockpit account to manage your crypto taxes and optimize your portfolio." property="og:description">
    <meta content="summary_large_image" name="twitter:card">
    <meta content="#2f6bed" name="theme-color">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --page-bg: #eef1f6;
            --card-bg: #ffffff;
            --input-bg: #e9edf4;
            --input-placeholder: #99a1b3;
            --btn-idle: #d9dee7;
            --btn-idle-text: #3c4250;
            --blue: #2f6bed;
            --blue-dark: #2458c9;
            --login-pill-bg: #e4eaf8;
            --login-pill-text: #33415e;
            --text-dark: #23283d;
            --text-muted: #6b7286;
            --line: #e3e7ee;
            --divider-text: #a7afbd;
        }

        html {
            -webkit-text-size-adjust: 100%;
            font-size: 87.5%;
        }

        body {
            font-family: 'Quicksand', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--page-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-dark);
            line-height: 1.5;
        }

        a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 700;
        }

        a:hover {
            text-decoration: underline;
        }

        /* ---------- Header ---------- */
        .site-header {
            background: #ffffff;
            border-bottom: 1px solid #e8ebf1;
            padding: 0 2rem;
            height: 68px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            background: #101425;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.25rem;
            line-height: 1;
            padding-bottom: 2px;
        }

        .header-divider {
            width: 1px;
            height: 28px;
            background: #e3e7ee;
        }

        .main-nav {
            display: flex;
            gap: 2.25rem;
        }

        .main-nav a {
            color: #333a45;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.02rem;
        }

        .main-nav a:hover {
            color: #101425;
            text-decoration: none;
        }

        .header-actions {
            display: flex;
            gap: 0.9rem;
        }

        .btn-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 1.7rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: background-color .2s ease, filter .2s ease;
        }

        .btn-pill:hover {
            text-decoration: none;
            filter: brightness(.96);
        }

        .btn-pill-login {
            background: var(--login-pill-bg);
            color: var(--login-pill-text);
        }

        .btn-pill-signup {
            background: var(--blue);
            color: #ffffff;
        }

        /* ---------- Main / Card ---------- */
        .auth-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
        }

        .auth-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 12px 44px rgba(23, 32, 71, .10);
            width: 100%;
            max-width: 560px;
            padding: 3.5rem 4rem 3rem;
            text-align: center;
        }

        .card-logo {
            width: 56px;
            height: 56px;
            background: #101425;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 700;
            font-size: 2rem;
            line-height: 1;
            padding-bottom: 3px;
            margin: 0 auto 1.4rem;
        }

        .form-title {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: .6rem;
        }

        .form-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 1.9rem;
            line-height: 1.55;
        }

        .social-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: .8rem;
            margin-bottom: 1.6rem;
        }

        .social-btn {
            height: 58px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color .2s ease, background-color .2s ease;
            padding: 0;
        }

        .social-btn:hover {
            border-color: #c6cedd;
            background: #f7f9fc;
        }

        .social-btn svg {
            width: 25px;
            height: 25px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 0 0 1.5rem;
            color: var(--divider-text);
            font-size: .95rem;
            font-weight: 600;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .divider span {
            padding: 0 1.1rem;
        }

        .form-group {
            margin-bottom: 1.1rem;
            text-align: left;
        }

        .form-input {
            width: 100%;
            padding: 1.05rem 1.15rem;
            border: 2px solid transparent;
            border-radius: 11px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 500;
            background: var(--input-bg);
            color: var(--text-dark);
            transition: border-color .2s ease, background-color .2s ease;
        }

        .form-input::placeholder {
            color: var(--input-placeholder);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--blue);
            background: #ffffff;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap .form-input {
            padding-right: 3.2rem;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #7a8398;
            padding: .25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: #4a5468;
        }

        .forgot-line {
            text-align: center;
            margin: 1.6rem 0 1.5rem;
        }

        .forgot-line a {
            font-size: .98rem;
        }

        /* Primary action — matches the "Get started" header button when active */
        .btn-submit {
            width: 100%;
            padding: 1.05rem;
            background: var(--btn-idle);
            color: var(--btn-idle-text);
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background-color .2s ease, filter .2s ease;
        }

        .btn-submit:disabled {
            cursor: not-allowed;
        }

        .btn-submit:not(:disabled) {
            background: var(--blue);
            color: #ffffff;
        }

        .btn-submit:not(:disabled):hover {
            background: var(--blue-dark);
        }

        .btn-submit.is-loading {
            opacity: .75;
            pointer-events: none;
        }

        .switch-line {
            margin-top: 1.6rem;
            color: var(--text-muted);
            font-size: .98rem;
            font-weight: 500;
        }

        .form-message {
            display: none;
            margin-top: 1rem;
            font-size: .92rem;
            font-weight: 600;
            color: #c0392b;
        }

        .form-message.show {
            display: block;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 640px) {
            .site-header {
                padding: 0 1rem;
            }

            .header-divider,
            .main-nav {
                display: none;
            }

            .btn-pill {
                padding: .55rem 1.15rem;
                font-size: .92rem;
            }

            .auth-card {
                padding: 2.4rem 1.5rem 2rem;
                border-radius: 16px;
            }

            .social-row {
                gap: .55rem;
            }

            .social-btn {
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-left">
            <a href="index.html" aria-label="Blockpit home"><div class="brand-mark">B</div></a>
            <div class="header-divider"></div>
            <nav class="main-nav">
                <a href="index.html" data-i18n="navFeatures">Features</a>
                <a href="pricing.html" data-i18n="navPricing">Pricing</a>
                <a href="contact.html" data-i18n="navContact">Contact</a>
            </nav>
        </div>
        <div class="header-actions">
            <a href="login.html" class="btn-pill btn-pill-login" data-i18n="navLogin">Log In</a>
            <a href="register.html" class="btn-pill btn-pill-signup" data-i18n="navSignup">Sign Up</a>
        </div>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <div class="card-logo">B</div>
            <h1 class="form-title" data-i18n="welcomeTitle">Welcome back!</h1>
            <p class="form-subtitle" data-i18n="welcomeSubtitle">Log in to your Blockpit account and do your taxes in an easy and compliant way.</p>

            <div class="social-row">
                <!-- Google (official) -->
                <button type="button" class="social-btn" data-provider="Google" aria-label="Continue with Google">
                    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                </button>
                <!-- Apple (official) -->
                <button type="button" class="social-btn" data-provider="Apple" aria-label="Continue with Apple">
                    <svg viewBox="0 0 24 24" fill="#000000"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.56-1.702"/></svg>
                </button>
                <!-- Blockpit (official app icon) -->
                <button type="button" class="social-btn" data-provider="Blockpit" aria-label="Continue with Blockpit">
                    <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#101425"/><text x="12" y="17.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4ade80" font-family="Quicksand, Arial, sans-serif">B</text></svg>
                </button>
                <!-- Coinbase (official) -->
                <button type="button" class="social-btn" data-provider="Coinbase" aria-label="Continue with Coinbase">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#0052ff"/><path fill="#ffffff" d="M12 18.5a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13zm0-10.4a3.9 3.9 0 1 0 0 7.8 3.9 3.9 0 0 0 0-7.8z"/></svg>
                </button>
            </div>

            <div class="divider"><span data-i18n="or">or</span></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <input class="form-input" type="email" id="email" name="email" data-i18n-ph="emailPh" placeholder="Email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <div class="password-wrap">
                        <input class="form-input" type="password" id="password" name="password" data-i18n-ph="passwordPh" placeholder="Password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" data-toggle-password aria-label="Show password">
                            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <p class="forgot-line"><a href="contact.html" data-i18n="forgot">Forgot your password?</a></p>

                <button type="submit" class="btn-submit" id="submitBtn" data-i18n="logInBtn" disabled>Log In</button>
                <p class="form-message" id="formMessage" role="alert"></p>
            </form>

            <p class="switch-line"><span data-i18n="noAccount">Still haven't created an account?</span> <a href="register.html" data-i18n="signUpHere">Sign up here</a></p>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        (function () {
            /* ---------- i18n: shared with register.html ---------- */
            var T = {
                en: {
                    navFeatures: 'Features', navPricing: 'Pricing', navContact: 'Contact',
                    navLogin: 'Log In', navSignup: 'Sign Up',
                    welcomeTitle: 'Welcome back!',
                    welcomeSubtitle: 'Log in to your Blockpit account and do your taxes in an easy and compliant way.',
                    or: 'or',
                    emailPh: 'Email', passwordPh: 'Password',
                    forgot: 'Forgot your password?',
                    logInBtn: 'Log In',
                    noAccount: "Still haven't created an account?", signUpHere: 'Sign up here',
                    errRequired: 'Please fill in all fields.',
                    errPasswordShort: 'Password must be at least 6 characters long.',
                    errEmailInvalid: 'Please enter a valid email address.',
                    busy: 'Please wait…',
                    successLogin: 'Login successful! Redirecting…',
                    socialSoon: '{provider} sign-in will be available soon.'
                },
                de: {
                    navFeatures: 'Funktionen', navPricing: 'Preise', navContact: 'Kontakt',
                    navLogin: 'Anmelden', navSignup: 'Registrieren',
                    welcomeTitle: 'Willkommen zurück!',
                    welcomeSubtitle: 'Melde dich bei deinem Blockpit-Konto an und erledige deine Steuern einfach und konform.',
                    or: 'oder',
                    emailPh: 'E-Mail', passwordPh: 'Passwort',
                    forgot: 'Passwort vergessen?',
                    logInBtn: 'Anmelden',
                    noAccount: 'Noch kein Konto erstellt?', signUpHere: 'Hier registrieren',
                    errRequired: 'Bitte fülle alle Felder aus.',
                    errPasswordShort: 'Das Passwort muss mindestens 6 Zeichen lang sein.',
                    errEmailInvalid: 'Bitte gib eine gültige E-Mail-Adresse ein.',
                    busy: 'Bitte warten…',
                    successLogin: 'Anmeldung erfolgreich! Weiterleitung…',
                    socialSoon: 'Die Anmeldung über {provider} ist bald verfügbar.'
                },
                it: {
                    navFeatures: 'Funzioni', navPricing: 'Prezzi', navContact: 'Contatto',
                    navLogin: 'Accedi', navSignup: 'Registrati',
                    welcomeTitle: 'Bentornato!',
                    welcomeSubtitle: "Accedi al tuo account Blockpit e gestisci le tue tasse in modo semplice e conforme.",
                    or: 'oppure',
                    emailPh: 'Email', passwordPh: 'Password',
                    forgot: 'Password dimenticata?',
                    logInBtn: 'Accedi',
                    noAccount: 'Non hai ancora un account?', signUpHere: 'Registrati qui',
                    errRequired: 'Compila tutti i campi.',
                    errPasswordShort: 'La password deve contenere almeno 6 caratteri.',
                    errEmailInvalid: 'Inserisci un indirizzo email valido.',
                    busy: 'Attendere…',
                    successLogin: 'Accesso effettuato! Reindirizzamento…',
                    socialSoon: 'L\'accesso con {provider} sarà presto disponibile.'
                }
            };

            function detectLang() {
                // 1. explicit ?lang= parameter (and persist it as the user's choice)
                var m = /[?&]lang=([a-z]{2})(-[a-z]{2})?/i.exec(location.search);
                if (m && T[m[1].toLowerCase()]) {
                    try { localStorage.setItem('blockpit-lang', m[1].toLowerCase()); } catch (e) {}
                    return m[1].toLowerCase();
                }
                // 2. the language page the user came from
                var ref = document.referrer || '';
                if (/de-(de|at|ch)/i.test(ref)) return 'de';
                if (/(\/it\.html|\/it\/)/i.test(ref)) return 'it';
                if (/(index\.html|blockpit\.io\/?$)/i.test(ref)) return 'en';
                // 3. a language the user explicitly chose earlier
                try {
                    var saved = localStorage.getItem('blockpit-lang');
                    if (saved && T[saved]) return saved;
                } catch (e) {}
                // 4. browser language
                var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
                if (nav.indexOf('de') === 0) return 'de';
                if (nav.indexOf('it') === 0) return 'it';
                return 'en';
            }

            var lang = detectLang();
            var dict = T[lang];
            document.documentElement.lang = lang === 'en' ? 'en' : (lang === 'de' ? 'de' : 'it');

            function applyI18n() {
                document.querySelectorAll('[data-i18n]').forEach(function (el) {
                    var k = el.getAttribute('data-i18n');
                    if (dict[k] !== undefined) el.innerHTML = dict[k];
                });
                document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
                    var k = el.getAttribute('data-i18n-ph');
                    if (dict[k] !== undefined) el.placeholder = dict[k];
                });
            }
            applyI18n();

            /* ---------- Password visibility toggle ---------- */
            document.querySelectorAll('[data-toggle-password]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var input = btn.parentElement.querySelector('input');
                    var show = input.type === 'password';
                    input.type = show ? 'text' : 'password';
                    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                });
            });

            /* ---------- Social provider buttons ---------- */
            var message = document.getElementById('formMessage');
            function showMessage(text, isError) {
                message.textContent = text;
                message.style.color = isError ? '#c0392b' : '#1e9e5a';
                message.classList.add('show');
            }
            document.querySelectorAll('.social-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    showMessage(dict.socialSoon.replace('{provider}', btn.getAttribute('data-provider')), false);
                });
            });

            /* ---------- Submit button state (grey → blue like "Get started") ---------- */
            var form = document.getElementById('loginForm');
            var submitBtn = document.getElementById('submitBtn');
            var emailInput = document.getElementById('email');
            var passwordInput = document.getElementById('password');

            function refreshButton() {
                var valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim())
                    && passwordInput.value.length >= BlockpitAuth.MIN_PASSWORD_LENGTH;
                submitBtn.disabled = !valid;
            }
            emailInput.addEventListener('input', refreshButton);
            passwordInput.addEventListener('input', refreshButton);
            refreshButton();

            /* ---------- Login (Firebase or demo fallback) ---------- */
            form.addEventListener('submit', function (event) {
                event.preventDefault();
                var email = emailInput.value.trim();
                var password = passwordInput.value;

                if (!email || !password) {
                    showMessage(dict.errRequired, true);
                    return;
                }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    showMessage(dict.errEmailInvalid, true);
                    return;
                }
                if (password.length < BlockpitAuth.MIN_PASSWORD_LENGTH) {
                    showMessage(dict.errPasswordShort, true);
                    return;
                }

                submitBtn.classList.add('is-loading');
                submitBtn.textContent = dict.busy;

                BlockpitAuth.signIn(email, password).then(function () {
                    showMessage(dict.successLogin, false);
                    setTimeout(function () {
                        var done = false;
                        try { done = localStorage.getItem('blockpit-setup-complete') === '1'; } catch (e) {}
                        window.location.href = done ? 'dashboard.html' : 'setup.html';
                    }, 700);
                }).catch(function (err) {
                    submitBtn.classList.remove('is-loading');
                    submitBtn.textContent = dict.logInBtn;
                    var code = err && err.code;
                    if (code === 'invalid-email') showMessage(dict.errEmailInvalid, true);
                    else if (code === 'weak-password') showMessage(dict.errPasswordShort, true);
                    else if (code === 'wrong-password') showMessage(lang === 'de' ? 'Falsches Passwort.' : (lang === 'it' ? 'Password errata.' : 'Incorrect password.'), true);
                    else if (code === 'network') showMessage(lang === 'de' ? 'Netzwerkfehler. Bitte versuche es erneut.' : (lang === 'it' ? 'Errore di rete. Riprova.' : 'Network error. Please try again.'), true);
                    else showMessage(lang === 'de' ? 'Anmeldung fehlgeschlagen. Bitte versuche es erneut.' : (lang === 'it' ? 'Accesso non riuscito. Riprova.' : 'Login failed. Please try again.'), true);
                });
            });

            /* Already signed in? Go straight through. */
            if (BlockpitAuth.getSession) {
                BlockpitAuth.getSession().then(function (user) {
                    if (!user) return;
                    var done = false;
                    try { done = localStorage.getItem('blockpit-setup-complete') === '1'; } catch (e) {}
                    window.location.href = done ? 'dashboard.html' : 'setup.html';
                });
            }
        })();
    </script>
</body>
</html>
